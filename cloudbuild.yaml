steps:
  # 1. Build Docker image with GCR tags
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/quick-sort-simulator:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/quick-sort-simulator:latest'
      - '.'

  # 2. Push image to Google Container Registry (GCR)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/quick-sort-simulator:latest'

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'quick-sort-simulator'
      - '--image'
      - 'gcr.io/$PROJECT_ID/quick-sort-simulator:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/quick-sort-simulator:latest'
  - 'gcr.io/$PROJECT_ID/quick-sort-simulator:$COMMIT_SHA'
